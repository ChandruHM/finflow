name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '21'

jobs:
  # ─────────────────────────────────────────────────────────
  # Deploy Frontend to Vercel
  # ─────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: apps/frontend
          vercel-args: --prod

  # ─────────────────────────────────────────────────────────
  # Deploy Node Service to Render
  # ─────────────────────────────────────────────────────────
  deploy-node-service:
    name: Deploy Node Service → Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  # ─────────────────────────────────────────────────────────
  # Deploy Java Service to Oracle Cloud
  # ─────────────────────────────────────────────────────────
  deploy-java-service:
    name: Deploy Java Service → Oracle Cloud
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Build JAR
        run: |
          cd apps/service-java
          ./mvnw clean package -DskipTests

      - name: Deploy to Oracle Cloud
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_CLOUD_HOST }}
          username: opc
          key: ${{ secrets.ORACLE_CLOUD_SSH_KEY }}
          source: "apps/service-java/target/*.jar"
          target: "/home/opc/finflow/"

      - name: Restart Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_CLOUD_HOST }}
          username: opc
          key: ${{ secrets.ORACLE_CLOUD_SSH_KEY }}
          script: |
            sudo systemctl restart finflow-java

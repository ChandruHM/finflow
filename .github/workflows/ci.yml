name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '21'

jobs:
  # ─────────────────────────────────────────────────────────
  # Frontend — Next.js
  # ─────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Unit Tests
        run: npm test -- --coverage --passWithNoTests

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────────────────
  # Service Node — Express.js
  # ─────────────────────────────────────────────────────────
  service-node:
    name: Service Node (Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/service-node

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/service-node/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test -- --coverage --passWithNoTests

  # ─────────────────────────────────────────────────────────
  # Service Java — Spring Boot
  # ─────────────────────────────────────────────────────────
  service-java:
    name: Service Java (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/service-java

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Build & Test
        run: ./mvnw clean verify

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-results
          path: apps/service-java/target/surefire-reports/

  # ─────────────────────────────────────────────────────────
  # Agent Orchestrator Package
  # ─────────────────────────────────────────────────────────
  agent-orchestrator:
    name: Agent Orchestrator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent-orchestrator

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: packages/agent-orchestrator/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test -- --passWithNoTests

  # ─────────────────────────────────────────────────────────
  # E2E Tests — Playwright
  # ─────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend, service-node, service-java]

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: finflow
          MONGO_INITDB_ROOT_PASSWORD: finflow_secret

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright
        run: |
          cd tests/playwright
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: |
          cd tests/playwright
          npx playwright test
        env:
          MONGODB_URI: mongodb://finflow:finflow_secret@localhost:27017/finflow?authSource=admin

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright/playwright-report/

# ─── Server ──────────────────────────────────────────────
server.port=8080
spring.application.name=finflow-service-java

# ─── MongoDB ─────────────────────────────────────────────
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/finflow}
spring.data.mongodb.auto-index-creation=true

# ─── Actuator ────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ─── Application Info ────────────────────────────────────
info.app.name=FinFlow Java Service
info.app.description=Enterprise data processing and business logic
info.app.version=1.0.0

# ─── Logging ─────────────────────────────────────────────
logging.level.com.finflow=DEBUG
logging.level.org.springframework.data.mongodb=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ─── OpenAI (for Java-Core Agent) ───────────────────────
openai.api.key=${OPENAI_API_KEY:}
openai.model=gpt-4o

# ─── Threading ───────────────────────────────────────────
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
